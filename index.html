<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto RA</title>
    <!-- Importamos A-Frame y el motor MindAR -->
    <script src="./libs/aframe.min.js"></script>
    <script src="./libs/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Cambia "marcador.mind" si tu archivo se llama diferente -->
    <a-scene mindar-image="imageTargetSrc: ./marcador.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">

      <a-assets>
          <!-- Si quieres usar tu propio video, guárdalo en la carpeta del proyecto y cambia src por "./tu-video.mp4" -->
          <video id="marker-video"
                 src="libs/abue.mp4"
                 loop
                 muted
                 playsinline
                 crossorigin="anonymous"></video>
      </a-assets>

      <script>
          document.addEventListener('DOMContentLoaded', function () {
              const video = document.getElementById('marker-video');
              if (video) {
                  video.style.filter = 'grayscale(100%) contrast(1.05) brightness(0.88)';
                  video.addEventListener('loadeddata', function () {
                      video.play().catch(function () {});
                  }, { once: true });
              }
          });
      </script>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Cuando la cámara detecte tu imagen impresa (Target 0), mostrará lo de aquí adentro -->
      <a-entity mindar-image-target="targetIndex: 0">
          <!-- Marco oscuro y sobrio -->
          <a-box position="0 0 -0.18" width="2.9" height="2.3" depth="0.20" color="#1a1716"></a-box>
          <a-box position="0 0 -0.06" width="2.6" height="2.0" depth="0.14" color="#4a3528"></a-box>
          <a-box position="0 0 0.04" width="2.28" height="1.72" depth="0.10" color="#2a211d"></a-box>

          <!-- Video en blanco y negro, íntimo y memorial -->
          <a-plane position="0 0 0.12"
                   width="1.90"
                   height="1.35"
                   material="src: #marker-video; side: double; shader: flat"></a-plane>
      </a-entity>

    </a-scene>

</body>
</html>
